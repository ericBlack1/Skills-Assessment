[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests", "alembic"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = [
    "B008",  # Depends() in FastAPI route signatures is intentional
]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]  # autogenerated migration lines

[tool.ruff.lint.isort]
known-first-party = ["app"]
