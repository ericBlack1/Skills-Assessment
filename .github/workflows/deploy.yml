name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL secret is not configured."
            exit 1
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
          echo "Render deploy triggered."

      - name: Wait for live health check
        env:
          RENDER_SERVICE_URL: ${{ secrets.RENDER_SERVICE_URL }}
        run: |
          if [ -z "$RENDER_SERVICE_URL" ]; then
            echo "RENDER_SERVICE_URL secret is not configured."
            exit 1
          fi
          health_url="${RENDER_SERVICE_URL%/}/health"
          echo "Waiting for ${health_url} ..."
          for attempt in $(seq 1 36); do
            if curl -fsS "$health_url" | grep -q '"status":"ok"'; then
              echo "Health check passed."
              exit 0
            fi
            echo "Attempt ${attempt}/36 not ready yet, waiting 10s..."
            sleep 10
          done
          echo "Health check timed out after 6 minutes."
          exit 1
