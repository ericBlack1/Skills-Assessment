name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: taskmanager_test
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: taskmanager_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U taskmanager_test -d taskmanager_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    env:
      CI: "true"
      DATABASE_URL: postgresql://taskmanager_test:testpassword@localhost:5432/taskmanager_test
      TEST_DATABASE_URL: postgresql://taskmanager_test:testpassword@localhost:5432/taskmanager_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run database migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest -v
